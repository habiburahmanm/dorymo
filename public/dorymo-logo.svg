  <circle cx="220" cy="182" r="7" fill="#FF8527"/>

  <!-- Check: white with orange outline, fully inside the D -->
  <use href="#tick" stroke="#FF8527" stroke-width="32"/>
  <use href="#tick" stroke="#FFFFFF" stroke-width="20"/>

  <!-- Wordmark -->
  <text x="440" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="180" font-weight="800" letter-spacing="-3" fill="#2F3080">dorymo</text>
</svg>
