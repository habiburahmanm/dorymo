<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="dorymo">
  <title>dorymo</title>
  <defs>
    <!-- tick kept entirely inside the D bowl -->
    <path id="tick" d="M150 178 L200 236 Q211 246 224 236 L306 132" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Flat orange D -->
  <path d="M94 58 H182 C270 58 358 112 358 175 C358 238 270 292 182 292 H94 A26 26 0 0 1 68 266 V84 A26 26 0 0 1 94 58 Z" fill="#FF8527"/>

  <!-- Simple flat door (no 3D panel) -->
